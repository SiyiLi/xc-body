[project]
name = "xc-body-stackchan"
version = "0.1.5"
description = "XC Body gateway for the StackChan K151/CoreS3 robot"
requires-python = ">=3.10"
license = "MIT"
license-files = [
    "stackchan_mcp/LICENSE",
]
dependencies = [
    "aiohttp>=3",
    "mcp>=1.27,<2.0",
    "platformdirs>=4.0,<5.0",
    "pydantic>=2",
    "python-dotenv",
    "PyYAML>=6",
    "tomli>=2.0,<3.0; python_version < '3.11'",
    "websockets>=12",
    "zeroconf>=0.149",
]

[project.scripts]
stackchan-mcp = "stackchan_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stackchan_mcp"]
artifacts = [
    "stackchan_mcp/notify.example.yml",
]
